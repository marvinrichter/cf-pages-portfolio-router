name = "redundant-services-router"
main = "worker.js"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "redundant.services/*", zone_name = "redundant.services" }
]

[vars]
# Subdomain suffix for service projects.
# {slug}.{TARGET_DOMAIN} — change to "netlify.app", "vercel.app", or your own domain.
TARGET_DOMAIN = "pages.dev"
# Slug to redirect to when hitting the root URL.
# Update this (or override in the CF dashboard) when your default service changes.
DEFAULT_SERVICE = "standup-as-a-service"
