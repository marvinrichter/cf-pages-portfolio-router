name: Bug Report
description: Something isn't routing correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.
  - type: input
    id: url
    attributes:
      label: Request URL
      description: The URL that isn't routing as expected
      placeholder: https://example.com/my-service/
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected target
      description: Where should the request route to?
      placeholder: https://my-service.pages.dev/
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: wrangler.toml [vars]
      description: Your config (no secrets)
      render: toml
